
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACL Mobile PDF Viewer</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eee}
header{background:#222;color:white;padding:14px;font-weight:bold}
#controls{padding:10px;display:flex;gap:8px;align-items:center}
button,input{padding:11px;font-size:16px}
button{cursor:pointer}
#page{width:65px}
#status{padding:8px;font-size:13px}
iframe{width:100%;height:calc(100dvh - 110px);border:0;background:white}
</style>
</head>
<body>
<header>ACL PDF Page Viewer</header>

<div id="controls">
<button onclick="changePage(-1)">Previous</button>
<input id="page" type="number" min="1" value="1">
<button onclick="changePage(1)">Next</button>
</div>

<div id="status">Loading PDF...</div>
<iframe id="viewer"></iframe>

<script>
const params = new URLSearchParams(location.search);
const fileId = params.get("fileId");
let page = Math.max(1, Number(params.get("page")) || 1);

function showPage() {
  document.getElementById("page").value = page;

  const pdfURL =
    "https://pdf-drive-proxy35d6.afaqahmedce082.workers.dev/?id=" +
    encodeURIComponent(fileId) + "#page=" + page;

  document.getElementById("viewer").src = pdfURL;
  document.getElementById("status").textContent =
    "PDF loaded | Requested page: " + page;
}

function changePage(amount) {
  page = Math.max(1, page + amount);
  showPage();
}

document.getElementById("page").addEventListener("change", function() {
  page = Math.max(1, Number(this.value) || 1);
  showPage();
});

if (fileId) {
  showPage();
} else {
  document.getElementById("status").textContent = "Missing Google Drive File ID";
}
</script>
</body>
</html>
