
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile PDF Viewer</title>
<style>
body{margin:0;font-family:Arial;background:#eee}
header{background:#222;color:white;padding:12px}
#controls{padding:10px;display:flex;gap:8px;align-items:center}
button,input{padding:10px}
#page{width:55px}
iframe{width:100%;height:85vh;border:0;background:white}
#status{padding:10px}
</style>
</head>
<body>
<header>ACL PDF Page Viewer</header>
<div id="controls">
<button onclick="changePage(-1)">Previous</button>
<input id="page" type="number" min="1" value="1">
<button onclick="changePage(1)">Next</button>
</div>
<div id="status">Loading PDF...</div>
<iframe id="viewer"></iframe>

<script>
const params=new URLSearchParams(location.search);
const fileId=params.get("fileId");
let page=Math.max(1,Number(params.get("page"))||1);

function showPage(){
 document.getElementById("page").value=page;
 document.getElementById("viewer").src=
 "https://drive.google.com/file/d/"+encodeURIComponent(fileId)+
 "/preview#page="+page;
 document.getElementById("status").textContent="Requested page "+page;
}
function changePage(amount){
 page=Math.max(1,page+amount);
 showPage();
}
document.getElementById("page").addEventListener("change",function(){
 page=Math.max(1,Number(this.value)||1);
 showPage();
});
if(fileId)showPage();
else document.getElementById("status").textContent="Missing PDF ID";
</script>
</body>
</html>
