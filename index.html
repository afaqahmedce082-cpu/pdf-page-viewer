
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Page Viewer</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eeeeee;
}

header {
    background: #17365d;
    color: white;
    padding: 14px;
    text-align: center;
    font-size: 20px;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: white;
}

button {
    padding: 9px 16px;
    cursor: pointer;
}

#pageInfo {
    font-weight: bold;
}

#pdfCanvas {
    display: block;
    max-width: 96%;
    height: auto;
    margin: 15px auto;
    background: white;
    box-shadow: 0 2px 8px #999;
}

#message {
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<header>PDF Page Viewer</header>

<div class="controls">
    <button id="prev">Previous</button>
    <span id="pageInfo">Loading...</span>
    <button id="next">Next</button>
</div>

<div id="message">Loading PDF...</div>
<canvas id="pdfCanvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const params = new URLSearchParams(location.search);

const fileId = params.get("id");
const requestedPage = Math.max(
    1, parseInt(params.get("page"), 10) || 1
);

let pdfDoc = null;
let currentPage = requestedPage;

const canvas = document.getElementById("pdfCanvas");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");

async function renderPage(pageNumber) {
    const page = await pdfDoc.getPage(pageNumber);
    const viewport = page.getViewport({scale: 1.5});

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({
        canvasContext: ctx,
        viewport: viewport
    }).promise;

    currentPage = pageNumber;

    document.getElementById("pageInfo").textContent =
        "Page " + currentPage + " of " + pdfDoc.numPages;

    document.getElementById("prev").disabled =
        currentPage <= 1;

    document.getElementById("next").disabled =
        currentPage >= pdfDoc.numPages;

    message.textContent = "";
}

async function loadPDF() {
    if (!fileId) {
        message.textContent = "No PDF selected.";
        return;
    }

    try {
        const url =
    "https://pdf-drive-proxy35d6.afaqahmedce082.workers.dev/?id=" +
    encodeURIComponent(fileId);
       pdfDoc = await pdfjsLib.getDocument({
    url: url,
    disableRange: true,
    disableStream: true
}).promise;

        if (requestedPage > pdfDoc.numPages) {
            throw new Error("Requested page does not exist.");
        }

        await renderPage(requestedPage);

    } catch (error) {
        message.textContent =
            "Unable to load PDF. Check file access and browser CORS permissions. " +
            error.message;
        console.error(error);
    }
}

document.getElementById("prev").onclick = () => {
    if (pdfDoc && currentPage > 1) {
        renderPage(currentPage - 1);
    }
};

document.getElementById("next").onclick = () => {
    if (pdfDoc && currentPage < pdfDoc.numPages) {
        renderPage(currentPage + 1);
    }
};

loadPDF();
</script>

</body>
</html>
